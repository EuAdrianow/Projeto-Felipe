<header class="site-header">
    <div class="header-container">

        <a class="logo" routerLink="/home" aria-label="TechPec - início">
            <span class="logo-icon">T</span>
            <span class="logo-name">Tech<span>Pec</span></span>
        </a>

        <span class="header-message">
            Tecnologia para evoluir seu setup.
        </span>

        <div class="header-actions">
            <a class="header-action account-link" routerLink="/login">
                <span class="action-icon">♙</span>
                <span class="action-text">
                    <small>Bem-vindo</small>
                    <strong>Minha conta</strong>
                </span>
            </a>

            <a
  class="header-action cart-link"
  routerLink="/carrinho"
  aria-label="Abrir carrinho"
>
  <span class="action-icon cart-icon-wrap">
    🛒
    @if (carrinho.quantidadeTotal() > 0) {
      <span class="cart-badge">{{ carrinho.quantidadeTotal() }}</span>
    }
  </span>
  <span class="action-text">
    <small>Carrinho</small>
    <strong>
      @if (carrinho.quantidadeTotal() > 0) {
        {{ carrinho.quantidadeTotal() }} item(ns)
      } @else {
        Vazio
      }
    </strong>
  </span>
</a>
        </div>

    </div>
</header>
